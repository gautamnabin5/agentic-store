name: CI

on:
  push:
  pull_request:

jobs:
  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit tests
        working-directory: backend
        run: |
          mvn test -B \
            -Dtest="ResultTest,JwtUtilTest,AuthServiceTest,AuthControllerTest,ProductServiceTest,ProductControllerTest,OrderServiceTest,OrderControllerTest,AdminOrderControllerTest,ResultReturnValueHandlerTest"

  backend-integration-tests:
    name: Backend integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run integration tests (Testcontainers)
        working-directory: backend
        run: |
          mvn test -B \
            -Dtest="AgenticStoreApplicationTests,AuthIntegrationTest,ProductIntegrationTest,OrderIntegrationTest"

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Type check and build
        working-directory: frontend
        run: pnpm build

      - name: Run unit tests
        working-directory: frontend
        run: pnpm exec vitest run
