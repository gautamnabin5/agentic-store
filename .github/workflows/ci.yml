name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit tests
        working-directory: backend
        run: |
          mvn test -B \
            -Dtest="ResultTest,JwtUtilTest,AuthServiceTest,AuthControllerTest,ProductServiceTest,ProductControllerTest,OrderServiceTest,OrderControllerTest,AdminOrderControllerTest"

      - name: Run integration tests (Testcontainers)
        working-directory: backend
        run: mvn test -B -Dtest="AgenticStoreApplicationTests"
